image: ros:humble

cache:
  key:
    files:
      - poetry.lock
  paths:
    - .venv/

stages:
  - lint
  - test

before_script:
  - python3 -c "import urllib.request; exec(urllib.request.urlopen('https://install.python-poetry.org').read())"
  - export PATH="/root/.local/bin:$PATH"
  - poetry config virtualenvs.in-project true
  - poetry install
  - source .venv/bin/activate

pre-commit:
  stage: lint
  script:
    - poetry run pre-commit run --all-files

ros-component-test:
  stage: test
  script:
    - source /opt/ros/humble/setup.bash
    - echo "Running ROS2 node tests (spins up LocalizationNode) with coverage..."
    - poetry run pytest tests/ros2/ --cov-report=xml
  coverage: '/Total coverage: (\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
